水完成标签设计、启动合作并进入首单履约，属典型“新品破冰带动订单回流”。  \n- **交付顺延覆盖全部TOP10已合作客户（除香港711外）**：新天地、Today、每一天、邻几、凯辉等共10家客户出现交期延迟，**根本原因高度集中于标签反复修改与包材确认滞后**——邻几、凯辉、24客、乐豆家均因标签设计多轮返工（金标替换、转曲图缺失、打样问题），导致工厂无法锁定最终版面，进而阻滞排产启动；叠加24客新增5000件1L订单需协调新工厂拼产，进一步加剧产能调度刚性。  \n\n**客户线索概述**  \n意向池持续扩容但转化节奏偏缓：悦来悦喜、京津冀美宜佳（冰杯）保持高频跟进，但40家未沟通意向客户中，含全家、中石化易捷、光明集团等战略级渠道，尚未建立有效触达路径，线索沉淀仍以被动响应为主。\n\n---\n\n### 二、供给端：标签—包材—排产链路断裂，成为交付最大堵点  \n\n**工厂排产与库存状态**  \n- **标签反复修改引发排产连锁延迟**：邻几、凯辉、24客、新天地四家客户同步推进1L/368ml标签改版，其中邻几两次修改、凯辉二次打样未闭环、24客协议条款变更与标签设计并行，直接导致华跃、锦鸿等主力工厂无法释放稳定排产窗口；**包材到位≠可投产**，因标签未终审，工厂拒绝启动印制，形成“包材静置→排产冻结→订单顺延”死循环。  \n- **大货消化与库存结构失衡并存**：新天地8.5万件历史库存加速出清支撑了当月高增长，但壹度、京小盒、家园便利等客户出库归零，反映部分SKU动销彻底停滞；乐豆家420ml虽完成检测报告并启动生产，但因三方合同法务审核未闭环，发货仍受制约。\n\n**发货情况**  \n- **运力组织能力不足暴露区域性短板**：邻几芜湖仓“找车难”非孤立事件，结合“有发货无单号约2笔”，指向物流协同机制薄弱——未建立区域仓运力预占机制，临时询价、比价、调度耗时过长，造成至少3家客户（邻几、乐豆家、集刻）存在发货延迟风险，影响区域到货时效及客户结算节奏。\n\n---\n\n### 三、履约端：染菌与霉变类质量事故频发，暴露品控前移失效  \n\n- **安哒1L装召回为本期最严重质量事件**：因疑似染菌导致2074瓶整批召回，工厂承担全部残损成本并承诺补货，直接损失超¥18万元，且引发客户对供应链稳定性信任动摇，回款至今未落地。  \n- **邻几、新天地、壹度、京小盒集中爆发微生物类客诉**：邻几368ml客诉1起、新天地沈阳门店上架异常（事由未写明）、壹度絮状物函告、京小盒霉变——四案均指向同一风险源：**椰子水灌装环节密封性或灭菌参数波动未被实时监控**，工厂未建立批次留样与快速溯源机制，导致问题定位滞后、赔付被动。  \n- **闭环进展分化明显**：安哒、邻几已闭环报损；新天地、壹度仍处样品寄回与染菌排查阶段；京小盒霉变尚未见工厂根因反馈，质量响应链条存在断层。\n\n---\n\n### 四、ERP操作员备注专项分析：手工干预频次低但信号敏感，返工/隔离类备注凸显过程失控  \n\n15笔库存调整仅净变动-15箱，规模微小，但**5条含“返工/隔离/报废”标签的备注集中出现在新天地、Today、邻几等高流量客户SKU上**，尤其锦鸿库新天地368ml单次调减16箱，指向终端验收或仓内质检触发异常处置；自然语言建项21条中20条为“生产/计划”，说明一线仍依赖人工补录驱动作业，系统计划刚性不足，而质量类手工备注正成为过程失控的隐性预警指标。\n\n---  \n**结语：9月是“高增长下的高风险月”**。营收环比+131.9%表象之下，是标签协同失灵、品控前移缺位、运力响应迟滞三大系统性卡点的集中显性化。下月攻坚必须聚焦：① 建立标签终审红黄灯机制（法务+设计+工厂三方会签）；② 对椰子水灌装线启动灭菌参数日监控与批次留样强制执行；③ 在华东/华北试点区域仓运力预占协议。增长不可持续，除非把交付确定性真正焊进流程里。"}</script>
  <script>
    const D = JSON.parse(document.getElementById('data').textContent);
    const money = (n) => '¥' + Math.round(n || 0).toLocaleString('zh-CN');
    const num = (n, d=0) => Number(n || 0).toLocaleString('zh-CN', {maximumFractionDigits:d, minimumFractionDigits:d});
    const pct = (x) => {
      if (x === null || x === undefined || Number.isNaN(x)) return '—';
      const v = x * 100;
      const cls = v >= 0 ? 'up' : 'down';
      return `<span class="${cls}">${v >= 0 ? '+' : ''}${v.toFixed(1)}%</span>`;
    };

    document.getElementById('title').textContent = `诺好供应链 · ${D.label}`;
    document.getElementById('subtitle').textContent = '以 ERP 为业务主轴、天财为财务口径｜静态分享版';
    document.getElementById('meta').innerHTML = [
      `天财 ${D.acc}`,
      `业务 ${D.biz}`,
      `已合作 ${D.counts.cooperated}`,
      `意向跟进中 ${D.counts.intent_active}`,
      `意向未沟通 ${D.counts.intent_silent}`,
    ].map(t => `<span class="chip">${t}</span>`).join('');
    document.getElementById('foot-period').textContent = D.period;

    const k = D.kpi;
    const cards = [
      {label:'9月天财总出库额', value: money(k.sales), sub:`环比 ${strip(pct(k.mom))} · 同比 ${strip(pct(k.yoy))}`},
      {label:'ERP 活跃项目', value: `${k.erp_active_projects} 个`, sub:`合作新品 ${k.new_products} 个`},
      {label:'ERP 物流发货', value: `${num(k.erp_ship_boxes)} 箱`, sub:`${k.erp_ship_tickets} 票 / ${k.erp_ship_docs} 单`},
      {label:'累计发货额', value: money(k.ship_supply_amount), sub:`运费单价 ¥${num(k.freight_per_box,2)}（环比 ${strip(pct(k.freight_per_box_mom))}）`},
      {label:'工厂暂存库存', value: `${num(k.inventory_boxes)} 箱`, sub: (k.inventory_by_factory||[]).map(f=>`${f.name} ${f.customers}客/${num(f.boxes)}箱`).join(' · ') || '—'},
      {label:'综合退货率', value: strip(pct(k.return_rate)), sub:'账面口径'},
    ];

    document.getElementById('kpi').innerHTML = cards.map(c => `

    document.getElementById('coop-body').innerHTML = (D.cooperated_top||[]).map(r => `
      <tr>
        <td>${r.name}</td>
        <td class="num">${money(r.sales)}</td>
        <td class="num">${pct(r.yoy)}</td>
        <td class="num">${pct(r.mom)}</td>
        <td class="num">${money(r.ship_amt)}</td>
        <td class="num">${money(r.freight)}</td>
        <td><span class="tag">${r.status||'—'}</span></td>
      </tr>`).join('');

    document.getElementById('intent-body').innerHTML = (D.intent_active||[]).map(r => `
      <tr><td>${r.name}</td><td class="num">${r.mentions}</td><td>${r.manager||'—'}</td></tr>
    `).join('') || '<tr><td colspan="3">暂无</td></tr>';
    document.getElementById('silent-note').textContent = `另有意向但未沟通 ${D.counts.intent_silent} 家（本页不展开名单）。`;

    document.getElementById('op-body').innerHTML = (D.operators||[]).map(r => `
      <tr><td>${r.name}</td><td class="num">${r.reports}</td><td class="num">${r.customers}</td></tr>
    `).join('');

    const items = (k.new_product_items||[]);
    document.getElementById('inv-panel').innerHTML = `
      <div class="label" style="color:var(--muted);font-size:12px;margin-bottom:8px">合作新品明细</div>
      ${items.length ? `<ul style="margin:0;padding-left:1.1em;font-size:13px">${items.map(i=>`<li>${i}</li>`).join('')}</ul>` : '—'}
    `;
  </script>
</body>
</html>
